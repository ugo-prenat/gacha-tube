services:
  postgres:
    image: postgres:16-alpine
    container_name: gacha-tube-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: gacha_tube
      POSTGRES_USER: gacha
      POSTGRES_PASSWORD: gacha
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gacha -d gacha_tube']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
